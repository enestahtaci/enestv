# Builds and tests both platforms on every push and pull request. Read-only: no secrets, no publishing.
# Actions are official GitHub actions pinned to a release commit (tag in the comment); update them together.
name: CI

on:
  push:
    branches: [main, "android/**", "core/**", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings are errors)
        run: dotnet build enestv.sln -c Release
      - name: Unit and fixture tests
        run: dotnet test EnesTV.Tests -c Release --no-build

  android:
    name: Android TV (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25" # LTS, same major as Android Studio's bundled JDK
      - name: Core fixture tests, release build, lint
        run: ./gradlew --no-daemon :core:test :app:assembleRelease :app:lintRelease
